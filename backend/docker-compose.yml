services:
  cinema-service:
    image: cinema-service
    build: ./cinema-service
    ports:
      - "6090:6090"
    restart: unless-stopped
    networks:
        - inner-network 

    postgres:
      image: postgres:latest
      expose:
        - "5432"
      environment:
        - POSTGRES_USER=CinemaUser
        - POSTGRES_PASSWORD=OurCinemaVeryCool
        - POSTGRES_DB=CinemaBase
      restart: unless-stopped
      networks:
        - inner-network


networks:
  inner-network:
    internal: true
  